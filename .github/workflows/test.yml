name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A fresh npm install resolves the optional LAN dependency added in v1.1.3.
      # Regenerate and commit a network-resolved lockfile later for npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
