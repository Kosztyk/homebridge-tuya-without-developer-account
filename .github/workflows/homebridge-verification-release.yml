name: Prepare Homebridge verification release
on:
  push:
    branches: [main]
    paths: [.github/workflows/homebridge-verification-release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-current-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Create the tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, re, urllib.request, urllib.error
          repository = os.environ['REPOSITORY']
          source_sha = os.environ['SOURCE_SHA']
          api_root = 'https://api.github.com/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'homebridge-verification-release'}
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api_root + path, data=data, headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def source_file(name):
              record = api('/contents/' + name + '?ref=' + source_sha)
              return base64.b64decode(record['content']).decode()
          package = json.loads(source_file('package.json'))
          # Create the release for the existing source tag. npm publishing follows in this workflow.
          tag = 'v' + package['version']
          try:
              existing = api('/releases/tags/' + tag)
              print('Release already exists: ' + existing['html_url'])
              raise SystemExit(0)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          changelog = source_file('CHANGELOG.md')
          lines = changelog.splitlines()
          notes = []
          found = False
          level = 0
          for line in lines:
              heading = re.match(r'^(#{1,2}) +\[?([^] \u2014]+)', line)
              if heading:
                  if found and len(heading.group(1)) <= level:
                      break
                  if heading.group(2) == package['version']:
                      found = True
                      level = len(heading.group(1))
                      continue
              if found:
                  notes.append(line)
          body = '\n'.join(notes).strip() or package['description']
          body += '\n\nnpm package: https://www.npmjs.com/package/' + package['name'] + '/v/' + package['version']
          body += '\n\nOfficial vendor artwork and source attribution are documented in BRANDING.md.'
          release = api('/releases', {'tag_name': tag, 'target_commitish': source_sha, 'name': tag, 'body': body, 'draft': False, 'prerelease': False, 'make_latest': 'true'})
          print('Created release: ' + release['html_url'])
          PYTHON

      - name: Publish the release version to npm if not already present
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p 'require("./package.json").name')"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} already exists on npm; skipping publish."
          else
            if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
              echo 'NPM_TOKEN secret is missing; publish the npm package manually.' >&2
              exit 1
            fi
            npm pack --dry-run
            npm publish --access public
          fi
